# Runs the package's testthat suite only (no full R CMD check).
# Based on the r-lib/actions v2 examples: https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [develop]
  pull_request:

name: test.yaml

permissions: read-all

jobs:
  test:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Run tests
        run: |
          testthat::test_local(
            reporter = testthat::ProgressReporter$new(show_praise = FALSE),
            stop_on_failure = TRUE
          )
        shell: Rscript {0}

      - name: Upload snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.os }}-r${{ matrix.config.r }}-testthat-snapshots
          path: tests/testthat/_snaps
          if-no-files-found: ignore
