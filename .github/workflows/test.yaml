# Runs the package's testthat suite on Linux.
# Based on the r-lib/actions v2 examples: https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [develop]
  pull_request:

name: test.yaml

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest

    name: ubuntu-latest (release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Run tests
        run: |
          testthat::test_local(
            reporter = testthat::ProgressReporter$new(show_praise = FALSE),
            stop_on_failure = TRUE
          )
        shell: Rscript {0}

      - name: Upload snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testthat-snapshots
          path: tests/testthat/_snaps
          if-no-files-found: ignore
