# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    paths: ["R/**"]

name: document.yaml

permissions: read-all

jobs:
  document:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: roxygen2

      - name: Generate and push documentation
        shell: bash
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"

          for attempt in {1..5}; do
            git fetch --no-tags origin "$GITHUB_REF"
            git reset --hard FETCH_HEAD
            base=$(git rev-parse HEAD)

            Rscript -e 'roxygen2::roxygenise()'
            git add -A -- man/ NAMESPACE DESCRIPTION

            if git diff --cached --quiet; then
              git fetch --no-tags origin "$GITHUB_REF"
              if [ "$(git rev-parse FETCH_HEAD)" = "$base" ]; then
                echo "No changes to commit"
                exit 0
              fi
            else
              git commit -m "Update documentation"
              if git push origin "HEAD:$GITHUB_REF"; then
                exit 0
              fi

              git fetch --no-tags origin "$GITHUB_REF"
              if [ "$(git rev-parse FETCH_HEAD)" = "$base" ]; then
                echo "Push failed without a branch update" >&2
                exit 1
              fi
            fi
            echo "Branch changed; regenerating documentation (attempt $attempt/5)"
          done

          echo "Could not update documentation after 5 attempts" >&2
          exit 1
